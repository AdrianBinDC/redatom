[package]
name = "reddit-rss-mcp"
version = "0.1.0"
edition = "2024"
description = "Rust MCP server: read Reddit via public Atom/RSS (.rss) only"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
feed-rs = "2.4"
governor = "0.10"
lru = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
axum = "0.8.9"

[dev-dependencies]
http = "1"
tower = "0.5"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
